name: influencerresearch

services:
  influencerresearch:
    build:
      context: .
      dockerfile: runtime/influencerresearch/Dockerfile
    container_name: influencerresearch-mcp
    user: "10001:10001"
    environment:
      INFLUENCER_RESEARCH_CONTAINER: "1"
      INFLUENCER_RESEARCH_MCP_PORT: "8770"
      INFLUENCER_RESEARCH_ALLOWED_HOSTS: "127.0.0.1:*,localhost:*,influencerresearch:*"
      INFLUENCER_RESEARCH_CAMOFOX_MODE: container
      INFLUENCER_RESEARCH_CAMOFOX_PROXY_BASE_URL: "http://camofox-public-proxy:9377"
      INFLUENCER_RESEARCH_CAMOFOX_PROXY_ATTEMPTS: "3"
      INFLUENCER_RESEARCH_CAMOFOX_PROXY_HOSTS: "tiktok.com,instagram.com"
      INFLUENCER_RESEARCH_DISCOVERY_BROWSER_WORKERS: "2"
      XDG_CACHE_HOME: /runtime/influencerresearch/cache
      HOME: /home/influencer
    ports:
      - "127.0.0.1:${INFLUENCER_RESEARCH_MCP_PORT:-8770}:8770"
    volumes:
      - type: bind
        source: ${INFLUENCER_RESEARCH_CONTROL_DIR:?INFLUENCER_RESEARCH_CONTROL_DIR is required}
        target: /research/control
      - type: bind
        source: ${INFLUENCER_RESEARCH_STATE_DIR:?INFLUENCER_RESEARCH_STATE_DIR is required}
        target: /research/state
      - type: bind
        source: ${INFLUENCER_RESEARCH_OUTPUT_DIR:?INFLUENCER_RESEARCH_OUTPUT_DIR is required}
        target: /research/output
      - type: bind
        source: ${INFLUENCER_RESEARCH_LOG_DIR:?INFLUENCER_RESEARCH_LOG_DIR is required}
        target: /research/logs
      - influencerresearch-runtime:/runtime/influencerresearch
    depends_on:
      camofox:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
      - /run/influencerresearch-secrets:rw,nosuid,nodev,noexec,size=64k,uid=10001,gid=10001,mode=0700
    post_start:
      - command:
          - sh
          - -c
          - >-
            umask 077;
            test -n "$$INFLUENCER_CAMOFOX_ACCESS_SECRET";
            test -n "$$INFLUENCER_CAMOFOX_ADMIN_SECRET";
            printf '%s' "$$INFLUENCER_CAMOFOX_ACCESS_SECRET" > /run/influencerresearch-secrets/camofox_access_key;
            printf '%s' "$$INFLUENCER_CAMOFOX_ADMIN_SECRET" > /run/influencerresearch-secrets/camofox_admin_key
        environment:
          INFLUENCER_CAMOFOX_ACCESS_SECRET: ${INFLUENCER_CAMOFOX_ACCESS_SECRET:?Camofox access runtime secret is required}
          INFLUENCER_CAMOFOX_ADMIN_SECRET: ${INFLUENCER_CAMOFOX_ADMIN_SECRET:?Camofox admin runtime secret is required}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket,sys;s=socket.socket();s.settimeout(2);sys.exit(0 if s.connect_ex(("127.0.0.1",8770))==0 else 1)
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks:
      - runtime

  camofox:
    build:
      context: .
      dockerfile: runtime/camofox/Dockerfile
    container_name: influencerresearch-camofox
    user: node
    environment:
      NODE_ENV: production
      CAMOFOX_PORT: "9377"
      CAMOFOX_BIND_HOST: 0.0.0.0
      CAMOFOX_LOCALE: sv-SE
      CAMOFOX_TIMEZONE: Europe/Stockholm
      CAMOUFOX_EXECUTABLE: /opt/camoufox/camoufox-bin
      CAMOUFOX_INSTALL_DIR: /opt/camoufox
      HOME: /run/camofox
      XDG_CACHE_HOME: /run/camofox/cache
      CAMOFOX_PROFILE_DIR: /run/camofox/profiles
      CAMOFOX_COOKIES_DIR: /run/camofox/cookies
      CAMOFOX_TRACES_DIR: /run/camofox/traces
      CAMOFOX_CRASH_REPORT_ENABLED: "false"
      CAMOFOX_DISABLE_DEFAULT_ADDONS: "true"
      CAMOFOX_CRASH_REPORT_URL: ""
      SENTRY_DSN: ""
      PROMETHEUS_ENABLED: "false"
      BROWSER_IDLE_TIMEOUT_MS: "60000"
      SESSION_TIMEOUT_MS: "60000"
      TAB_INACTIVITY_MS: "60000"
      MAX_CONCURRENT_PER_USER: "1"
      MAX_SESSIONS: "4"
      MAX_TABS_PER_SESSION: "4"
      MAX_TABS_GLOBAL: "8"
      TMPDIR: /tmp
      TMP: /tmp
      TEMP: /tmp
    expose:
      - "9377"
    dns:
      - 172.64.36.1
      - 172.64.36.2
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /run/camofox:rw,nosuid,nodev,size=384m,uid=1000,gid=1000,mode=0700
      - /run/camofox-secrets:rw,nosuid,nodev,noexec,size=64k,uid=1000,gid=1000,mode=0700
    post_start:
      - command:
          - sh
          - -c
          - >-
            umask 077;
            test -n "$$INFLUENCER_CAMOFOX_ACCESS_SECRET";
            test -n "$$INFLUENCER_CAMOFOX_ADMIN_SECRET";
            printf '%s' "$$INFLUENCER_CAMOFOX_ACCESS_SECRET" > /run/camofox-secrets/access_key;
            printf '%s' "$$INFLUENCER_CAMOFOX_ADMIN_SECRET" > /run/camofox-secrets/admin_key
        environment:
          INFLUENCER_CAMOFOX_ACCESS_SECRET: ${INFLUENCER_CAMOFOX_ACCESS_SECRET:?Camofox access runtime secret is required}
          INFLUENCER_CAMOFOX_ADMIN_SECRET: ${INFLUENCER_CAMOFOX_ADMIN_SECRET:?Camofox admin runtime secret is required}
    command:
      - sh
      - -c
      - >-
        while [ ! -s /run/camofox-secrets/access_key ] || [ ! -s /run/camofox-secrets/admin_key ]; do sleep 0.05; done;
        export CAMOFOX_ACCESS_KEY="$$(cat /run/camofox-secrets/access_key)";
        export CAMOFOX_ADMIN_KEY="$$(cat /run/camofox-secrets/admin_key)";
        exec node --max-old-space-size=192 /app/node_modules/@askjo/camofox-browser/server.js
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 1536m
    mem_limit: 3g
    cpus: 3.0
    pids_limit: 384
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:9377/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks:
      - runtime
      - browser_egress

  camofox-public-proxy:
    profiles:
      - public-proxy
    build:
      context: .
      dockerfile: runtime/camofox/Dockerfile
    container_name: influencerresearch-camofox-public-proxy
    user: node
    environment:
      NODE_ENV: production
      CAMOFOX_PORT: "9377"
      CAMOFOX_BIND_HOST: 0.0.0.0
      CAMOFOX_LOCALE: sv-SE
      CAMOFOX_TIMEZONE: Europe/Stockholm
      GEOIP_SETUP_TIMEOUT_MS: "30000"
      CAMOUFOX_EXECUTABLE: /opt/camoufox/camoufox-bin
      CAMOUFOX_INSTALL_DIR: /run/camofox-proxy/install
      HOME: /run/camofox-proxy
      XDG_CACHE_HOME: /run/camofox-proxy/cache
      CAMOFOX_PROFILE_DIR: /run/camofox-proxy/profiles
      CAMOFOX_COOKIES_DIR: /run/camofox-proxy/cookies
      CAMOFOX_TRACES_DIR: /run/camofox-proxy/traces
      CAMOFOX_CRASH_REPORT_ENABLED: "false"
      CAMOFOX_DISABLE_DEFAULT_ADDONS: "true"
      CAMOFOX_CRASH_REPORT_URL: ""
      SENTRY_DSN: ""
      PROMETHEUS_ENABLED: "false"
      BROWSER_IDLE_TIMEOUT_MS: "60000"
      SESSION_TIMEOUT_MS: "60000"
      TAB_INACTIVITY_MS: "60000"
      MAX_CONCURRENT_PER_USER: "1"
      MAX_SESSIONS: "4"
      MAX_TABS_PER_SESSION: "4"
      MAX_TABS_GLOBAL: "8"
      PROXY_STRATEGY: round_robin
      PROXY_PROTOCOL: http
      PROXY_HOST: p.webshare.io
      PROXY_PORT: "80"
      TMPDIR: /tmp
      TMP: /tmp
      TEMP: /tmp
    expose:
      - "9377"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /run/camofox-proxy:rw,nosuid,nodev,size=384m,uid=1000,gid=1000,mode=0700
      - /run/camofox-proxy-secrets:rw,nosuid,nodev,noexec,size=64k,uid=1000,gid=1000,mode=0700
    post_start:
      - command:
          - sh
          - -c
          - >-
            umask 077;
            test -n "$$INFLUENCER_CAMOFOX_ACCESS_SECRET";
            test -n "$$INFLUENCER_CAMOFOX_ADMIN_SECRET";
            test -n "$$INFLUENCER_PUBLIC_PROXY_USERNAME_SECRET";
            test -n "$$INFLUENCER_PUBLIC_PROXY_PASSWORD_SECRET";
            printf '%s' "$$INFLUENCER_CAMOFOX_ACCESS_SECRET" > /run/camofox-proxy-secrets/access_key;
            printf '%s' "$$INFLUENCER_CAMOFOX_ADMIN_SECRET" > /run/camofox-proxy-secrets/admin_key;
            printf '%s' "$$INFLUENCER_PUBLIC_PROXY_USERNAME_SECRET" > /run/camofox-proxy-secrets/proxy_username;
            printf '%s' "$$INFLUENCER_PUBLIC_PROXY_PASSWORD_SECRET" > /run/camofox-proxy-secrets/proxy_password
        environment:
          INFLUENCER_CAMOFOX_ACCESS_SECRET: ${INFLUENCER_CAMOFOX_ACCESS_SECRET:?Camofox access runtime secret is required}
          INFLUENCER_CAMOFOX_ADMIN_SECRET: ${INFLUENCER_CAMOFOX_ADMIN_SECRET:?Camofox admin runtime secret is required}
          INFLUENCER_PUBLIC_PROXY_USERNAME_SECRET: ${INFLUENCER_PUBLIC_PROXY_USERNAME_SECRET:?Public proxy username runtime secret is required}
          INFLUENCER_PUBLIC_PROXY_PASSWORD_SECRET: ${INFLUENCER_PUBLIC_PROXY_PASSWORD_SECRET:?Public proxy password runtime secret is required}
    command:
      - sh
      - -c
      - >-
        while [ ! -s /run/camofox-proxy-secrets/access_key ] || [ ! -s /run/camofox-proxy-secrets/admin_key ] || [ ! -s /run/camofox-proxy-secrets/proxy_username ] || [ ! -s /run/camofox-proxy-secrets/proxy_password ]; do sleep 0.05; done;
        test -r /opt/camoufox/version.json;
        test -d /opt/camoufox/fontconfig;
        mkdir -p /run/camofox-proxy/install;
        ln -sf /opt/camoufox/version.json /run/camofox-proxy/install/version.json;
        rm -rf /run/camofox-proxy/install/fontconfig;
        ln -s /opt/camoufox/fontconfig /run/camofox-proxy/install/fontconfig;
        export CAMOFOX_ACCESS_KEY="$$(cat /run/camofox-proxy-secrets/access_key)";
        export CAMOFOX_ADMIN_KEY="$$(cat /run/camofox-proxy-secrets/admin_key)";
        export PROXY_USERNAME="$$(cat /run/camofox-proxy-secrets/proxy_username)";
        export PROXY_PASSWORD="$$(cat /run/camofox-proxy-secrets/proxy_password)";
        exec node --max-old-space-size=192 /app/node_modules/@askjo/camofox-browser/server.js
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 1024m
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:9377/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks:
      - runtime

volumes:
  influencerresearch-runtime:

networks:
  runtime:
    driver: bridge
  browser_egress:
    driver: bridge
    enable_ipv6: true
