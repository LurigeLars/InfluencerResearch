# Public ChatGPT path:
# Cloudflare Access -> shared Tunnel -> influencer-gateway:8080 -> influencerresearch:8770/mcp
# The gateway publishes no host ports.
name: influencerresearch-public

services:
  gateway:
    image: node:26.9.0-alpine
    container_name: influencerresearch-gateway
    command: ["node", "/app/gateway.mjs"]
    user: node
    env_file:
      - public/gateway.env
    volumes:
      - ./public/gateway:/app:ro
    networks:
      edge:
        aliases:
          - influencer-gateway
      runtime: {}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  edge:
    driver: bridge
  runtime:
    external: true
    name: influencerresearch_runtime
