name: Validate MCP dependency watch

on:
  push:
    branches:
      - deps/mcp-2.3.0-watch

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate watcher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/check_custom_dependencies.py
          python scripts/check_custom_dependencies.py
