name: Custom dependency watch

on:
  # On-demand diagnostics only: the weekly fork review handles the reviewed
  # source pin, and Camofox's own upstream review handles browser releases.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check reviewed custom pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_custom_dependencies.py --sync-issues
