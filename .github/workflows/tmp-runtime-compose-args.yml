name: Temporary runtime Compose argument validation

on:
  push:
    branches:
      - fix/runtime-compose-args-20260926

permissions:
  contents: read

jobs:
  powershell-compose-args:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create fake Docker CLI
        shell: pwsh
        run: |
          $fake = Join-Path $PWD ".tmp-docker"
          New-Item -ItemType Directory -Force -Path $fake | Out-Null
          $env:DOCKER_LOG = Join-Path $fake "docker.log"
          "DOCKER_LOG=$env:DOCKER_LOG" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $cmd = @'
          @echo off
          echo %*>>"%DOCKER_LOG%"
          exit /b 0
          '@
          Set-Content -LiteralPath (Join-Path $fake "docker.cmd") -Value $cmd -Encoding ascii
          "$fake" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run Up action
        shell: pwsh
        run: |
          pwsh -NoProfile -File ".\scripts\runtime.ps1" -Action Up

      - name: Verify Compose arguments
        shell: pwsh
        run: |
          $lines = Get-Content -LiteralPath $env:DOCKER_LOG
          $lines | ForEach-Object { Write-Host $_ }
          $up = $lines | Where-Object { $_ -match '^compose -f .+compose\.yaml up -d --build$' }
          if (-not $up) {
            throw "runtime.ps1 did not forward 'up -d --build' to docker compose"
          }
