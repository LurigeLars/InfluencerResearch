name: Runtime regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Parse PowerShell runtime scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @("scripts/runtime.ps1", "scripts/authenticate_instagram.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Compile changed Python runtime modules
        run: >-
          python -m py_compile
          transcription_backend.py
          camofox_container.py
          tiktok_camofox_sync.py
          research_queue.py
          analysis_queue.py
          evaluation_progress.py
          mcp_job_worker.py
          single_video_analysis.py
          creator_registry.py
          creator_recent_check.py
          ephemeral_ingest.py
          influencerresearch_mcp.py
          youtube_creator_evaluation.py
      - name: Run deterministic regression tests
        run: >-
          python -m unittest -v
          test_camofox_container_config
          test_camofox_container_runtime
          test_camofox_public_proxy_fallback
          test_instagram_path_segments
          test_instagram_ingest_limits
          test_local_runtime_namespace
          test_mcp_contract
          test_single_video_analysis
          test_analysis_queue
          test_creator_evaluation_pipeline
          test_research_queue_story
          test_research_queue_content_sufficiency
          test_story_local_ocr
          test_story_ollama_backend
          test_tiktok_content_fallback
          test_tiktok_camofox_retries
          test_transcription_backend
          test_creator_recent_lifecycle
          test_mcp_job_semantics
          test_creator_recent_analysis_targets
          test_creator_recent_instagram
          test_creator_registry_runtime_metadata
          test_creator_mutations
          test_creator_recent_monitored_instagram
          test_creator_recent_youtube
          test_recent_discovery_parallelism
          test_mcp_status_summary
          test_recent_check_cap_deferral
          test_recent_check_empty_discovery
          test_visual_review_evidence
          test_command_line_hardening
          test_creator_recent_visual_review_status
          test_creator_recent_window_timezone
          test_creator_registry_bootstrap
          test_instagram_adaptive_visual_review
          test_legacy_bat_cleanup
          test_public_gateway_contract
          test_research_status_progress
          test_story_capture_readiness
          test_story_prefetch_capture_only
          test_tiktok_adaptive_visual_review
          test_url_domain_validation
          test_video_visual_evidence
          test_camofox_manifest_validation
          test_instagram_camofox_public_smoke
          test_smoke_production_separation
          test_tiktok_media_transport

  camofox-dependency-smoke:
    name: Camofox npm lock and patched transitive dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: runtime/camofox/package-lock.json
      - name: Reproduce hardened Camofox runtime dependency installation
        run: npm ci --ignore-scripts --omit=dev --omit=optional --no-audit --no-fund --prefix runtime/camofox
      - name: Verify installed patched security dependencies
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('runtime/camofox/node_modules');
          const expected = {
            '@modelcontextprotocol/sdk': '1.32.1',
            'body-parser': '2.4.0',
            'fast-uri': '3.1.9',
            'hono': '4.13.13',
            'ip-address': '10.7.5',
            'qs': '6.17.1',
          };
          const optionalPaths = new Set(['@modelcontextprotocol/sdk', 'fast-uri', 'hono']);
          const lock = JSON.parse(fs.readFileSync('runtime/camofox/package-lock.json', 'utf8'));
          for (const [name, version] of Object.entries(expected)) {
            const locked = lock.packages[`node_modules/${name}`];
            assert.equal(locked?.version, version, `${name} lock version`);
            assert.match(locked?.integrity ?? '', /^sha512-/, `${name} integrity`);
            const packageFile = path.join(root, name, 'package.json');
            if (fs.existsSync(packageFile)) {
              const actual = JSON.parse(fs.readFileSync(packageFile, 'utf8')).version;
              assert.equal(actual, version, `${name} installed version`);
            } else {
              // The runtime deliberately uses --omit=optional; an SDK-only
              // dependency tree can be absent but must remain patched in lock.
              assert.ok(optionalPaths.has(name), `${name} required dependency missing`);
            }
          }
          NODE
