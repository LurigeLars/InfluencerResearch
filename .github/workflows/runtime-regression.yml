name: Runtime regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Parse PowerShell runtime scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @("scripts/runtime.ps1", "scripts/authenticate_instagram.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Compile changed Python runtime modules
        run: >-
          python -m py_compile
          transcription_backend.py
          tiktok_camofox_sync.py
          research_queue.py
          creator_monitor.py
          creator_registry.py
          creator_recent_check.py
          influencerresearch_mcp.py
      - name: Run runtime secret regression tests
        run: >-
          python -m unittest -v
          test_camofox_container_config
          test_local_runtime_namespace
          test_mcp_contract
          test_research_queue_story
          test_research_queue_content_sufficiency
          test_tiktok_content_fallback
          test_transcription_backend
          test_creator_monitor
          test_creator_recent_analysis_targets
          test_creator_registry_runtime_metadata
          test_creator_recent_monitored_instagram
