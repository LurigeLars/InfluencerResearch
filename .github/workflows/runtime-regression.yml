name: Runtime regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Parse PowerShell runtime scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @("scripts/runtime.ps1", "scripts/authenticate_instagram.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Compile changed Python runtime modules
        run: >-
          python -m py_compile
          transcription_backend.py
          camofox_container.py
          tiktok_camofox_sync.py
          research_queue.py
          creator_monitor.py
          creator_registry.py
          creator_recent_check.py
          ephemeral_ingest.py
          influencerresearch_mcp.py
          youtube_creator_evaluation.py
      - name: Run runtime secret regression tests
        run: >-
          python -m unittest -v
          test_camofox_container_config
          test_camofox_container_runtime
          test_camofox_public_proxy_fallback
          test_instagram_path_segments
          test_instagram_ingest_limits
          test_local_runtime_namespace
          test_mcp_contract
          test_research_queue_story
          test_research_queue_content_sufficiency
          test_story_local_ocr
          test_story_ollama_backend
          test_tiktok_content_fallback
          test_tiktok_camofox_retries
          test_transcription_backend
          test_creator_monitor
          test_creator_recent_lifecycle
          test_mcp_job_semantics
          test_creator_recent_analysis_targets
          test_creator_recent_instagram
          test_creator_registry_runtime_metadata
          test_creator_recent_monitored_instagram
          test_creator_recent_youtube
          test_recent_discovery_parallelism
          test_mcp_status_summary
          test_visual_review_evidence
