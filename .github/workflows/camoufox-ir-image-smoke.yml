name: IR Camoufox browser image smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # pull_request has no paths filter so that the required gate always reports; this job
    # applies the same filter and the jobs below are skipped when nothing relevant changed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # The PR merge commit: HEAD^1 is the base, so this diff is exactly the PR's changes.
          if git diff --quiet HEAD^1 HEAD -- ':(glob)runtime/camofox/Dockerfile' ':(glob)test_camofox_container_runtime.py' ':(glob).github/workflows/camoufox-ir-image-smoke.yml'; then
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  ir-camoufox-image:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build actual IR Camofox image, verify upstream ZIP digest and native modules
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f runtime/camofox/Dockerfile -t ir-camofox-reviewed-candidate .
      - name: Verify runtime browser artifact and native SQLite without secrets
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --entrypoint node ir-camofox-reviewed-candidate \
            -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('/opt/camoufox/version.json','utf8'));if(!v.version||!v.release||!fs.existsSync('/opt/camoufox/camoufox-bin'))process.exit(1);const Database=require('better-sqlite3');const db=new Database(':memory:');if(db.prepare('select 1 as ok').get().ok!==1)process.exit(2);db.close();require('impit');const path=require('node:path');const fromCamofox=require('node:module').createRequire(path.join(process.cwd(),'node_modules/@askjo/camofox-browser/package.json'));if(typeof fromCamofox('express-rate-limit').rateLimit!=='function')process.exit(3);"
      - name: Run the patched browser as non-root and verify Playwright 1.64 protocol
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint node ir-camofox-reviewed-candidate \
            --input-type=module -e '
              import fs from "node:fs";
              import { createHash } from "node:crypto";
              import { firefox } from "playwright-core";
              const sha = createHash("sha256").update(fs.readFileSync("/opt/camoufox/omni.ja")).digest("hex");
              if (sha !== "2bad253389292f3009f669401eb8bc3abd615fb7c4e7d9619865f6c75b5c50fa") throw new Error("Patched browser digest mismatch");
              const browser = await firefox.launch({ executablePath: "/opt/camoufox/camoufox-bin", headless: true });
              try {
                const context = await browser.newContext();
                const page = await context.newPage();
                await page.route("**/probe", route => route.fulfill({ status: 200, body: "ir-juggler-ok" }));
                await page.goto("http://example.test/probe");
                if ((await page.locator("body").textContent()) !== "ir-juggler-ok") throw new Error("Routing failed");
                const storage = await context.storageState();
                if (!Array.isArray(storage.cookies) || !Array.isArray(storage.origins)) throw new Error("storageState failed");
                console.log("IR Camoufox Playwright 1.64.1 derived-image runtime smoke passed");
              } finally {
                await browser.close();
              }
            '

  gate:
    name: gate (camoufox-ir-image-smoke)
    if: always()
    needs: [changes, ir-camoufox-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or be skipped by the path filter
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A job in this workflow ended with: $result"; exit 1 ;;
            esac
          done
