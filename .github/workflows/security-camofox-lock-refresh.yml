name: Security Camofox lock refresh
on:
  push:
    branches: [security/pin-camofox-a869df5-20260927]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/pin-camofox-a869df5-20260927
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Refresh pinned Camofox lock
        working-directory: runtime/camofox
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/camofox/package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "security: lock patched Camofox fork artifact"
          git pull --rebase origin security/pin-camofox-a869df5-20260927
          git push origin HEAD:security/pin-camofox-a869df5-20260927
