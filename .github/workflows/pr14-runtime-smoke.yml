name: PR14 Runtime Smoke

on:
  push:
    branches:
      - feat/docker-mcp-runtime
    paths:
      - compose.yaml
      - requirements.txt
      - requirements_tiktok_impersonation.lock.txt
      - runtime/**
      - scripts/runtime.ps1
      - .github/workflows/pr14-runtime-smoke.yml

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAMOFOX_ACCESS_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CAMOFOX_ADMIN_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      INFLUENCER_RESEARCH_MCP_PORT: "8770"
      INFLUENCER_RESEARCH_CONTROL_DIR: /tmp/influencerresearch/control
      INFLUENCER_RESEARCH_STATE_DIR: /tmp/influencerresearch/state
      INFLUENCER_RESEARCH_OUTPUT_DIR: /tmp/influencerresearch/output
      INFLUENCER_RESEARCH_LOG_DIR: /tmp/influencerresearch/logs
    steps:
      - uses: actions/checkout@v4

      - name: Prepare bind mounts
        run: |
          sudo mkdir -p /tmp/influencerresearch/{control,state,output,logs}
          sudo chown -R 10001:10001 /tmp/influencerresearch

      - name: Validate Compose
        run: docker compose config >/dev/null

      - name: Build runtime
        run: docker compose build

      - name: Start runtime
        run: docker compose up -d

      - name: Wait for MCP health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8770/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1

      - name: Run focused container tests
        run: |
          docker compose exec -T influencerresearch python -m unittest -v             test_camofox_container_config             test_camofox_container_runtime             test_camofox_manifest_validation             test_tiktok_media_transport             test_smoke_production_separation             test_mcp_contract

      - name: Verify Camofox is internal-only
        run: |
          test -z "$(docker port influencerresearch-camofox 9377/tcp)"
          docker compose exec -T influencerresearch python - <<'PY'
          import urllib.request
          req = urllib.request.Request(
              "http://camofox:9377/health",
              headers={"Accept": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=5) as response:
              assert response.status == 200
          print("CAMOFOX_INTERNAL_HEALTH_OK")
          PY

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Stop runtime
        if: always()
        run: docker compose down -v
