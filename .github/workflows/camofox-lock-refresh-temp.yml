name: Temporary CamoFox lock refresh

on:
  push:
    branches:
      - fix/social-ingestion-camofox-20260927
    paths:
      - runtime/camofox/package.json

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/social-ingestion-camofox-20260927
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/camofox/package-lock.json
      - name: Refresh exact artifact lock
        working-directory: runtime/camofox
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/camofox/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: refresh CamoFox runtime lock"
          git push origin HEAD:fix/social-ingestion-camofox-20260927
