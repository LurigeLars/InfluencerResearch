name: PR28 Public Gateway Smoke

on:
  push:
    branches:
      - feat/cloudflare-public-gateway

permissions:
  contents: read

jobs:
  public-gateway-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare local env placeholders
        run: |
          cp public/gateway.env.example public/gateway.env
          cp public/tunnel.env.example public/tunnel.env

      - name: Parse gateway JavaScript
        run: |
          node --check public/gateway/gateway.mjs
          node --check public/gateway/policy.mjs

      - name: Parse PowerShell controller
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content scripts/public.ps1 -Raw)) | Out-Null

      - name: Validate public Compose
        run: docker compose -f compose.public.yaml config >/dev/null

      - name: Run public gateway contract tests
        run: python -m unittest -v test_public_gateway_contract
