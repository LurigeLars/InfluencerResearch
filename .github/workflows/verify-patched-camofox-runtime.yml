name: Verify patched Camofox runtime
on:
  push:
    branches: [security/pin-camofox-a869df5-20260927]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify runtime manifests and provenance
        run: python -m unittest test_camofox_container_runtime.py test_camofox_manifest_validation.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
      - name: Install exact locked Camofox artifact
        working-directory: runtime/camofox
        run: npm ci --ignore-scripts --omit=dev --omit=optional --no-audit --no-fund
      - name: Verify installed fork package
        working-directory: runtime/camofox
        run: |
          node -e "const p=require('./node_modules/@askjo/camofox-browser/package.json'); if(p.version!=='1.17.0') process.exit(2)"
          node --check node_modules/@askjo/camofox-browser/server.js
          node --check node_modules/@askjo/camofox-browser/lib/fly.js
