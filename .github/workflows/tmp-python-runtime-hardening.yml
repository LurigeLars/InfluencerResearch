name: Temporary Python runtime hardening validation

on:
  push:
    branches:
      - fix/python-runtime-scout-20260926
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build InfluencerResearch runtime image
        run: docker build -f runtime/influencerresearch/Dockerfile -t influencerresearch-runtime-test .

      - name: Verify Python dependency consistency
        run: docker run --rm influencerresearch-runtime-test python -m pip check

      - name: Verify remediated Python packages
        run: |
          docker run --rm influencerresearch-runtime-test python -c 'import importlib.metadata as m; assert m.version("msgpack") == "1.2.1"; assert m.version("setuptools") == "78.1.1"; print("PYTHON_PACKAGE_FIXES_OK")'

      - name: Report OpenSSL package version
        run: docker run --rm --entrypoint dpkg-query influencerresearch-runtime-test -W -f='\${Version}\n' openssl
