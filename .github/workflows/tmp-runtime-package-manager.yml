name: Temporary runtime base image validation

on:
  push:
    branches:
      - fix/runtime-package-manager-surface-20260926
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trixie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build current Bookworm candidate
        run: docker build -f runtime/influencerresearch/Dockerfile -t influencerresearch-bookworm .

      - name: Verify Bookworm candidate baseline
        run: |
          docker run --rm --entrypoint sh influencerresearch-bookworm -lc '
            set -eu
            test ! -d /usr/local/lib/python3.12/site-packages/pip
            test -d /usr/local/lib/python3.12/site-packages/msgpack-1.2.1.dist-info
            test -d /usr/local/lib/python3.12/site-packages/setuptools-83.0.0.dist-info
            test -d /usr/local/lib/python3.12/site-packages/setuptools/_vendor/wheel-0.46.3.dist-info
            test ! -d /usr/local/lib/python3.12/site-packages/setuptools/_vendor/jaraco.context-5.3.0.dist-info
            echo BOOKWORM_BASELINE_OK
            echo "=== PERL-RELATED DPKG PACKAGES ==="
            dpkg-query -W -f="${Package}	${Version}	${db:Status-Status}\n" "perl*" 2>/dev/null | sort || true
          '

      - name: Build same runtime on Debian Trixie
        run: |
          sed 's/^FROM python:3.12-slim-bookworm$/FROM python:3.12-slim-trixie/' runtime/influencerresearch/Dockerfile > /tmp/Dockerfile.trixie
          docker build -f /tmp/Dockerfile.trixie -t influencerresearch-trixie .

      - name: Run Python tests on Trixie
        run: |
          docker run --rm influencerresearch-trixie python -m unittest -v             test_camofox_container_config             test_camofox_container_runtime             test_camofox_manifest_validation             test_tiktok_media_transport             test_smoke_production_separation             test_mcp_contract

      - name: Launch Playwright Chromium on Trixie
        run: |
          docker run --rm influencerresearch-trixie python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content("<title>trixie-ok</title><p>runtime</p>")
              assert page.title() == "trixie-ok"
              browser.close()
          print("TRIXIE_PLAYWRIGHT_OK")
          PY

      - name: Verify Python runtime imports and metadata on Trixie
        run: |
          docker run --rm --entrypoint sh influencerresearch-trixie -lc '
            set -eu
            test ! -d /usr/local/lib/python3.12/site-packages/pip
            test -d /usr/local/lib/python3.12/site-packages/msgpack-1.2.1.dist-info
            test -d /usr/local/lib/python3.12/site-packages/setuptools-83.0.0.dist-info
            python -c "import mcp, playwright, yt_dlp, faster_whisper, imageio_ffmpeg, msgpack, curl_cffi, cffi, pycparser, certifi, influencerresearch_mcp; print('"'"'TRIXIE_IMPORTS_OK'"'"')"
            echo "=== TRIXIE PERL-RELATED DPKG PACKAGES ==="
            dpkg-query -W -f="${Package}	${Version}	${db:Status-Status}\n" "perl*" 2>/dev/null | sort || true
          '
