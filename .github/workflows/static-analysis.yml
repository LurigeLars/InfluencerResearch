name: Static analysis

on:
  push:
    branches: [main]
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - "**/*.sh"
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - "**/*.sh"
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: GitHub Actions / actionlint + ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify ShellCheck
        run: shellcheck --version

      - name: Install verified actionlint v1.7.12
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version

      - name: Lint GitHub Actions workflows
        run: /tmp/actionlint -color

  powershell:
    name: PowerShell / PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PSScriptAnalyzer 1.25.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -AllowClobber
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          Get-Module PSScriptAnalyzer | Select-Object Name, Version

      - name: Analyze all PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0

          $findings = @(
            Invoke-ScriptAnalyzer -Path . -Recurse -Severity @("Error", "Warning")
          )

          # Warnings that indicate meaningful security risk are blocking.
          # Other warnings remain visible as annotations but do not fail CI.
          $securityWarnings = @(
            "PSAvoidUsingInvokeExpression",
            "PSAvoidUsingPlainTextForPassword",
            "PSAvoidUsingBrokenHashAlgorithms",
            "PSAvoidUsingAllowUnencryptedAuthentication"
          )

          # Exact path+rule baselines are limited to reviewed cases where plaintext
          # exists only at a local DPAPI encryption boundary. They stay visible as warnings.
          $intentionalSuppressions = @{
            "scripts/authenticate_instagram.ps1|PSAvoidUsingConvertToSecureStringWithPlainText" = "Intentional DPAPI encryption boundary for locally supplied session material."
            "scripts/runtime.ps1|PSAvoidUsingConvertToSecureStringWithPlainText" = "Intentional DPAPI encryption boundary before protected-at-rest storage."
          }

          $blocking = @()
          foreach ($finding in $findings) {
            $severity = "$($finding.Severity)"
            $relativePath = if ($finding.ScriptPath) {
              [IO.Path]::GetRelativePath((Get-Location).Path, $finding.ScriptPath).Replace("\", "/")
            } else {
              ""
            }
            $key = "$relativePath|$($finding.RuleName)"
            $isBaselined = $intentionalSuppressions.ContainsKey($key)
            $isBlocking = (-not $isBaselined) -and (
              $severity -eq "Error" -or
              $securityWarnings -contains $finding.RuleName
            )
            $annotation = if ($isBlocking) { "error" } else { "warning" }
            $message = $finding.Message
            if ($isBaselined) {
              $message = "$message Baseline justification: $($intentionalSuppressions[$key])"
            }
            Write-Host ("::{0} file={1},line={2},col={3}::{4}: {5}" -f $annotation, $relativePath, $finding.Line, $finding.Column, $finding.RuleName, $message)
            if ($isBlocking) {
              $blocking += $finding
            }
          }

          if ($blocking.Count -gt 0) {
            throw "PSScriptAnalyzer found $($blocking.Count) blocking finding(s)."
          }

  dockerfile:
    name: Dockerfile / hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install verified hadolint v2.15.1
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 \
            -o /tmp/hadolint
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint
          /tmp/hadolint --version

      - name: Lint Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            echo "::group::hadolint $file"
            /tmp/hadolint --failure-threshold error "$file"
            echo "::endgroup::"
          done < <(find . -type f \( -name Dockerfile -o -name 'Dockerfile.*' \) -print0)
          if [ "$found" -eq 0 ]; then
            echo "No Dockerfiles found."
            exit 1
          fi
