version: 2

updates:
  # Standard Python runtime dependencies in requirements.txt.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # These packages belong to the separately installed, wheel-only,
    # hash-locked TikTok impersonation runtime. Keep that reviewed lock
    # out of routine version-update automation.
    ignore:
      - dependency-name: "curl_cffi"
      - dependency-name: "cffi"
      - dependency-name: "pycparser"
      - dependency-name: "certifi"

  # Container images referenced by compose.yaml and compose.public.yaml.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    groups:
      docker-compose-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Reviewed Node runtime for Camofox Browser. Updates require manual review; Dependabot only proposes them.
  - package-ecosystem: "npm"
    directory: "/runtime/camofox"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 3


  # Third-party GitHub Actions, including commit-SHA-pinned actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"


  # Base image used by /runtime/influencerresearch/Dockerfile.
  - package-ecosystem: "docker"
    directory: "/runtime/influencerresearch"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 3
    groups:
      dockerfile-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
